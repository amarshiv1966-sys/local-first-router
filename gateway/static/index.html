<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Local-first router</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css">
<script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.js"></script>
<script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/contrib/auto-render.min.js"></script>
<style>
  :root {
    --bg: #fafaf9; --panel: #ffffff; --ink: #1c1917; --muted: #78716c; --line: #e7e5e4;
    --local: #15803d; --local-bg: #dcfce7; --cloud: #1d4ed8; --cloud-bg: #dbeafe; --accent: #1c1917;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #1c1917; --panel: #292524; --ink: #f5f5f4; --muted: #a8a29e; --line: #44403c;
      --local: #86efac; --local-bg: #14532d; --cloud: #93c5fd; --cloud-bg: #1e3a8a; --accent: #f5f5f4;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink);
         font: 16px/1.55 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
  main { max-width: 760px; margin: 0 auto; padding: 32px 16px 64px; }
  h1 { font-size: 22px; margin: 0 0 4px; }
  .sub { color: var(--muted); margin: 0 0 24px; }
  textarea { width: 100%; min-height: 96px; padding: 12px; border: 1px solid var(--line); border-radius: 8px;
             background: var(--panel); color: var(--ink); font: inherit; resize: vertical; }
  .row { display: flex; gap: 12px; align-items: center; margin: 12px 0 28px; flex-wrap: wrap; }
  select, button { font: inherit; padding: 8px 14px; border-radius: 8px; border: 1px solid var(--line);
                   background: var(--panel); color: var(--ink); }
  button { background: var(--accent); color: var(--bg); border-color: var(--accent); cursor: pointer; }
  button:disabled { opacity: .5; cursor: wait; }
  .hint { color: var(--muted); font-size: 14px; }
  .card { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 18px; margin-bottom: 20px; }
  .badge { display: inline-block; font-weight: 600; font-size: 13px; padding: 2px 10px; border-radius: 99px; }
  .local { color: var(--local); background: var(--local-bg); }
  .cloud { color: var(--cloud); background: var(--cloud-bg); }
  .reason { margin-left: 8px; color: var(--muted); font-size: 14px; }
  .answer { margin-top: 14px; white-space: pre-wrap; overflow-x: auto; }
  dl { display: grid; grid-template-columns: repeat(auto-fit, minmax(130px, 1fr)); gap: 12px; margin: 16px 0 0; }
  dt { color: var(--muted); font-size: 13px; }
  dd { margin: 0; font-weight: 600; font-variant-numeric: tabular-nums; }
  h2 { font-size: 16px; margin: 0 0 4px; }
  .err { color: #b91c1c; }
  pre { background: var(--bg); border: 1px solid var(--line); border-radius: 8px; padding: 12px;
        overflow-x: auto; white-space: pre; font: 13px/1.5 ui-monospace, SFMono-Regular, Menlo, monospace; }
</style>
</head>
<body>
<main>
  <h1>Local-first router</h1>
  <p class="sub">A 4B model answers on this laptop. If it looks lost or unsure, the question goes to a 120B cloud model.
    Each question type has its own routing rule, measured on held-out questions.</p>

  <textarea id="q" placeholder="Ask a math question, e.g. What is the sum of the first 50 odd numbers?"></textarea>
  <div class="row">
    <select id="task" aria-label="Question type">
      <option value="auto">Auto-detect type</option>
      <option value="math">Math</option>
      <option value="code">Code</option>
      <option value="mmlu">Multiple choice</option>
      <option value="trivia">Fact</option>
      <option value="general">General</option>
    </select>
    <select id="mode" aria-label="Routing mode">
      <option value="auto">Auto (router decides)</option>
      <option value="local">Force local</option>
      <option value="cloud">Force cloud</option>
    </select>
    <button id="ask">Ask</button>
    <span class="hint" id="status"></span>
  </div>

  <div id="result"></div>

  <div class="card">
    <h2>All requests so far</h2>
    <dl id="stats"><div><dt>Requests</dt><dd>0</dd></div></dl>
  </div>
</main>

<script>
const $ = id => document.getElementById(id);

function esc(s) {
  return s.replace(/[&<>]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;" }[c]));
}

// ```python ... ``` blocks become <pre> boxes; everything else stays plain text
function withCode(s) {
  return esc(s).replace(/\n*```[a-zA-Z]*\n?([\s\S]*?)```\n*/g, (_, code) => `<pre><code>${code.trimEnd()}</code></pre>`);
}

function cell(label, value) {
  return `<div><dt>${label}</dt><dd>${value}</dd></div>`;
}

function usd(x) {
  return x ? "$" + x.toFixed(6) : "$0";
}

async function loadStats() {
  try {
    const s = await (await fetch("/stats")).json();
    if (!s.requests) return;
    $("stats").innerHTML =
      cell("Requests", s.requests) +
      cell("Answered locally", s.answered_locally) +
      cell("Cache hits", s.cache_hits) +
      cell("Cloud spend", usd(s.cloud_spend_usd)) +
      cell("Saved (estimate)", usd(s.saved_usd_estimate));
  } catch (e) { /* stats are optional */ }
}

async function ask() {
  const text = $("q").value.trim();
  if (!text) return;
  $("ask").disabled = true;
  $("status").textContent = "Thinking... the local model can take 10-60 s";
  const t0 = performance.now();
  try {
    const res = await fetch("/v1/chat/completions", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ model: $("mode").value, task: $("task").value,
                             messages: [{ role: "user", content: text }] }),
    });
    if (!res.ok) throw new Error(`server returned ${res.status}`);
    const out = await res.json();
    const r = out.router;
    const answer = out.choices[0].message.content;
    $("result").innerHTML = `
      <div class="card">
        <span class="badge ${r.route}">${r.route === "local" ? "Answered locally" : "Handed off to cloud"}</span>
        <span class="reason">${esc(r.reason || "")}${r.cached ? " · from cache" : ""}</span>
        <div class="hint" style="margin-top:6px">Type: <b>${esc(r.task || "?")}</b> (${esc(r.task_source || "")})</div>
        <div class="answer" id="answer">${withCode(answer)}</div>
        <dl>
          ${cell("Time", r.cached ? ((performance.now() - t0) / 1000).toFixed(2) + " s" : r.latency_s + " s")}
          ${cell("Local tokens", r.local_tokens ?? "-")}
          ${cell("Worst token log-prob", r.worst_logprob ?? "-")}
          ${cell("Cost", usd(r.cost_usd))}
          ${r.saved_usd ? cell("Saved vs cloud", usd(r.saved_usd)) : ""}
        </dl>
      </div>`;
    if (window.renderMathInElement) {
      renderMathInElement($("answer"), {
        delimiters: [
          { left: "$$", right: "$$", display: true }, { left: "\\[", right: "\\]", display: true },
          { left: "$", right: "$", display: false }, { left: "\\(", right: "\\)", display: false },
        ],
        throwOnError: false,
      });
    }
    $("status").textContent = "";
  } catch (e) {
    $("result").innerHTML = `<div class="card err">Request failed: ${esc(e.message)}</div>`;
    $("status").textContent = "";
  }
  $("ask").disabled = false;
  loadStats();
}

$("ask").addEventListener("click", ask);
$("q").addEventListener("keydown", e => { if (e.key === "Enter" && (e.metaKey || e.ctrlKey)) ask(); });
loadStats();
</script>
</body>
</html>

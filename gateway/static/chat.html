<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Local-first chat</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css">
<script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.js"></script>
<script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/contrib/auto-render.min.js"></script>
<style>
  :root {
    --bg: #fafaf9; --panel: #ffffff; --ink: #1c1917; --muted: #78716c; --line: #e7e5e4;
    --local: #15803d; --local-bg: #dcfce7; --cloud: #1d4ed8; --cloud-bg: #dbeafe; --user-bg: #f5f5f4;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #1c1917; --panel: #292524; --ink: #f5f5f4; --muted: #a8a29e; --line: #44403c;
      --local: #86efac; --local-bg: #14532d; --cloud: #93c5fd; --cloud-bg: #1e3a8a; --user-bg: #44403c;
    }
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body { margin: 0; background: var(--bg); color: var(--ink); display: flex;
         font: 15px/1.55 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
  aside { width: 240px; border-right: 1px solid var(--line); padding: 16px 10px; overflow-y: auto; flex-shrink: 0; }
  aside button { width: 100%; margin-bottom: 12px; }
  .conv { padding: 8px 10px; border-radius: 8px; cursor: pointer; color: var(--muted);
          white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-size: 14px; }
  .conv:hover { background: var(--user-bg); }
  .conv.active { background: var(--user-bg); color: var(--ink); font-weight: 600; }
  .conv { display: flex; align-items: center; gap: 4px; }
  .conv span { flex: 1; overflow: hidden; text-overflow: ellipsis; }
  .conv .del { border: none; background: none; padding: 0 4px; color: var(--muted); cursor: pointer;
               width: auto; margin: 0; visibility: hidden; font-size: 16px; line-height: 1; }
  .conv:hover .del { visibility: visible; }
  .conv .del:hover { color: #dc2626; }
  main { flex: 1; display: flex; flex-direction: column; min-width: 0; }
  #log { flex: 1; overflow-y: auto; padding: 24px 16px; }
  .wrap { max-width: 760px; margin: 0 auto; }
  .msg { margin-bottom: 18px; }
  .user .bubble { background: var(--user-bg); border-radius: 12px; padding: 10px 14px;
                  margin-left: auto; max-width: 85%; width: fit-content; white-space: pre-wrap; }
  .assistant .bubble { white-space: pre-wrap; overflow-x: auto; }
  .meta { font-size: 13px; color: var(--muted); margin-top: 6px; }
  .badge { display: inline-block; font-weight: 600; font-size: 12px; padding: 1px 9px; border-radius: 99px; margin-right: 6px; }
  .local { color: var(--local); background: var(--local-bg); }
  .cloud { color: var(--cloud); background: var(--cloud-bg); }
  form { border-top: 1px solid var(--line); padding: 12px 16px; }
  .bar { display: flex; gap: 8px; align-items: flex-end; }
  textarea { flex: 1; min-height: 46px; max-height: 200px; padding: 11px 12px; border: 1px solid var(--line);
             border-radius: 10px; background: var(--panel); color: var(--ink); font: inherit; resize: vertical; }
  select, button { font: inherit; padding: 8px 12px; border-radius: 8px; border: 1px solid var(--line);
                   background: var(--panel); color: var(--ink); }
  button.primary { background: var(--ink); color: var(--bg); border-color: var(--ink); cursor: pointer; }
  button:disabled { opacity: .5; cursor: wait; }
  .opts { display: flex; gap: 8px; margin-top: 8px; font-size: 13px; color: var(--muted); align-items: center; flex-wrap: wrap; }
  .opts select { padding: 4px 8px; font-size: 13px; }
  pre { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 12px;
        overflow-x: auto; white-space: pre; font: 13px/1.5 ui-monospace, SFMono-Regular, Menlo, monospace; }
  .empty { color: var(--muted); text-align: center; margin-top: 18vh; }
  a { color: inherit; }
  @media (max-width: 700px) { aside { display: none; } }
</style>
</head>
<body>
<aside>
  <button class="primary" id="new">+ New chat</button>
  <div id="convs"></div>
</aside>
<main>
  <div id="log"><div class="wrap" id="msgs"></div></div>
  <form id="form">
    <div class="wrap">
      <div class="bar">
        <textarea id="q" placeholder="Message… (Enter to send, Shift+Enter for a new line)"></textarea>
        <button class="primary" id="send">Send</button>
      </div>
      <div class="opts">
        <select id="mode" aria-label="Routing">
          <option value="auto">Router decides</option>
          <option value="local">Local only</option>
          <option value="cloud">Cloud only</option>
        </select>
        <select id="task" aria-label="Question type">
          <option value="auto">Auto-detect type</option>
          <option value="general">General</option>
          <option value="math">Math</option>
          <option value="code">Code</option>
          <option value="mmlu">Multiple choice</option>
          <option value="trivia">Fact</option>
        </select>
        <span id="status"></span>
        <a href="/" style="margin-left:auto">single-question demo</a>
      </div>
    </div>
  </form>
</main>
<script>
const $ = id => document.getElementById(id);
let current = null;

const esc = s => s.replace(/[&<>]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;" }[c]));
const withCode = s => esc(s).replace(/\n*```[a-zA-Z]*\n?([\s\S]*?)```\n*/g, (_, c) => `<pre><code>${c.trimEnd()}</code></pre>`);

function meta(r) {
  if (!r) return "";
  const where = r.route === "local" ? "Local 4B" : "Cloud 120B";
  const bits = [r.reason, r.task && `type: ${r.task}`, r.latency_s != null && `${r.latency_s} s`,
                r.cost_usd ? `$${r.cost_usd.toFixed(6)}` : null, r.cached && "from cache"].filter(Boolean);
  return `<div class="meta"><span class="badge ${r.route}">${where}</span>${esc(bits.join(" · "))}</div>`;
}

function add(role, text, router) {
  $("msgs").querySelector(".empty")?.remove();
  const div = document.createElement("div");
  div.className = `msg ${role}`;
  div.innerHTML = `<div class="bubble">${role === "assistant" ? withCode(text) : esc(text)}</div>${meta(router)}`;
  $("msgs").appendChild(div);
  if (role === "assistant" && window.renderMathInElement) {
    renderMathInElement(div, { delimiters: [
      { left: "$$", right: "$$", display: true }, { left: "\\[", right: "\\]", display: true },
      { left: "$", right: "$", display: false }, { left: "\\(", right: "\\)", display: false }],
      throwOnError: false });
  }
  $("log").scrollTop = $("log").scrollHeight;
  return div;
}

function empty() {
  $("msgs").innerHTML = `<div class="empty">Start a conversation. A 4B model answers on this laptop;
    the router hands off to the 120B cloud model when it judges the local answer likely wrong.</div>`;
}

async function loadConvs() {
  const list = await (await fetch("/api/conversations")).json();
  $("convs").innerHTML = list.map(c =>
    `<div class="conv ${c.id === current ? "active" : ""}" data-id="${c.id}" title="${esc(c.title)}">
       <span>${esc(c.title)}</span><button class="del" aria-label="Delete chat" title="Delete chat">×</button></div>`).join("");
  document.querySelectorAll(".conv").forEach(el => {
    el.onclick = () => open_(+el.dataset.id);
    el.querySelector(".del").onclick = async e => {
      e.stopPropagation();
      if (!confirm("Delete this chat?")) return;
      await fetch(`/api/conversations/${el.dataset.id}`, { method: "DELETE" });
      if (current === +el.dataset.id) { current = null; empty(); }
      loadConvs();
    };
  });
}

async function open_(id) {
  current = id;
  const c = await (await fetch(`/api/conversations/${id}`)).json();
  $("msgs").innerHTML = "";
  c.messages.forEach(m => add(m.role, m.content, m.router));
  loadConvs();
}

async function send(e) {
  e?.preventDefault();
  const text = $("q").value.trim();
  if (!text) return;
  $("q").value = "";
  add("user", text);
  const pending = add("assistant", "…");
  $("send").disabled = true;
  $("status").textContent = "thinking (local answers take 5–60 s)";
  try {
    const res = await fetch("/api/chat", { method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ text, conversation_id: current, model: $("mode").value, task: $("task").value }) });
    if (!res.ok) throw new Error(`server returned ${res.status}`);
    const out = await res.json();
    pending.remove();
    add("assistant", out.reply, out.router);
    if (current !== out.conversation_id) { current = out.conversation_id; loadConvs(); }
  } catch (err) {
    pending.querySelector(".bubble").textContent = `Request failed: ${err.message}`;
  }
  $("send").disabled = false;
  $("status").textContent = "";
}

$("form").addEventListener("submit", send);
$("q").addEventListener("keydown", e => { if (e.key === "Enter" && !e.shiftKey) send(e); });
$("new").onclick = () => { current = null; empty(); loadConvs(); $("q").focus(); };
empty();
loadConvs();
</script>
</body>
</html>
